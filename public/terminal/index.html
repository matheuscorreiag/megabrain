<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0f14" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Terminal</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/martian-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/terminal/style.css" />
    <!-- The Files editor's packages (CodeMirror), served from node_modules by server.js. -->
    <script type="importmap">
      {
        "imports": {
          "@codemirror/": "/vendor/npm/@codemirror/",
          "@lezer/": "/vendor/npm/@lezer/",
          "@marijn/": "/vendor/npm/@marijn/",
          "crelt": "/vendor/npm/crelt",
          "style-mod": "/vendor/npm/style-mod",
          "w3c-keyname": "/vendor/npm/w3c-keyname"
        }
      }
    </script>
  </head>
  <body>
    <aside id="sidebar" aria-label="Terminals">
      <div class="side-head">
        <div class="brand-row">
          <span id="conn" class="conn" role="status" aria-live="polite"><span class="sr-only"></span></span>
          <button id="close-sidebar" class="icon-btn panel-btn" type="button" aria-label="Hide sidebar" title="Hide sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
          </button>
        </div>
        <button id="new-tab" class="side-btn primary" type="button">
          <span class="swatch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></span>
          <span>New terminal</span>
          <kbd class="hint" id="new-tab-hint"></kbd>
        </button>
      </div>
      <div class="side-label label"><span>Terminals</span><span class="count" id="tab-count"></span></div>
      <nav id="tab-list" class="side-list"></nav>
      <div class="side-foot">
        <button id="toggle-files" class="side-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
          <span>Files</span>
          <kbd class="hint" id="files-hint"></kbd>
        </button>
        <button id="chat-here" class="side-btn" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12zM12 8.5v7M8.5 12h7" /></svg>
          <span>New chat in this folder</span>
        </button>
        <a id="to-chats" class="side-btn" href="/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" /></svg>
          <span>Back to chats</span>
          <span id="chats-unread" class="unread-badge" hidden title="Chats with new replies"></span>
          <kbd class="hint" id="chats-hint"></kbd>
        </a>
      </div>
    </aside>
    <div id="scrim"></div>

    <main id="main">
      <button id="open-sidebar" class="icon-btn panel-btn" type="button" aria-label="Show sidebar" title="Show sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
        <span id="unread-badge" class="unread-badge" hidden aria-label="Chats with new replies"></span>
      </button>

      <section id="terms">
        <div id="empty">
          <p>No terminals open.</p>
          <button id="empty-new" class="side-btn primary" type="button">
            <span class="swatch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></span>
            <span>New terminal</span>
          </button>
        </div>
      </section>

      <aside id="files" aria-label="Files">
        <div class="files-head">
          <div class="files-title">
            <span class="label">Files</span>
            <button class="icon-btn small" data-act="close" type="button" aria-label="Close files" title="Close">×</button>
          </div>
          <div id="crumbs"></div>
          <div class="files-actions">
            <button data-act="up" type="button" title="Parent folder" aria-label="Parent folder">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
            </button>
            <button data-act="refresh" type="button" title="Refresh" aria-label="Refresh">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" /></svg>
            </button>
            <button data-act="new-file" type="button" title="New file" aria-label="New file">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M12 12v6M9 15h6" /></svg>
            </button>
            <button data-act="new-dir" type="button" title="New folder" aria-label="New folder">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10v6M9 13h6" /></svg>
            </button>
            <button data-act="upload" type="button" title="Upload files" aria-label="Upload files">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16" /></svg>
            </button>
            <button data-act="term-here" type="button" title="New terminal in this folder" aria-label="New terminal in this folder">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="m7 9 3 3-3 3M13 15h4" /></svg>
            </button>
            <label class="toggle"><input type="checkbox" id="show-hidden" /> hidden</label>
          </div>
        </div>
        <ul id="file-list"></ul>
        <input type="file" id="upload-input" multiple hidden />
        <div id="drop-hint">Drop to upload to this folder</div>
      </aside>

      <footer id="keys">
        <button data-key="esc" type="button">Esc</button>
        <button data-key="tab" type="button">Tab</button>
        <button data-key="stab" type="button" title="Shift+Tab">⇧Tab</button>
        <button data-key="ctrlc" type="button">^C</button>
        <button data-key="up" type="button">↑</button>
        <button data-key="down" type="button">↓</button>
        <button data-key="left" type="button">←</button>
        <button data-key="right" type="button">→</button>
        <button data-key="enter" type="button">⏎</button>
        <button data-scroll="up" type="button" title="Scroll up">⇞</button>
        <button data-scroll="down" type="button" title="Scroll down">⇟</button>
      </footer>
    </main>

    <dialog id="editor">
      <div class="editor-head">
        <strong id="editor-name"></strong>
        <span id="editor-status"></span>
      </div>
      <div id="editor-text"></div>
      <div class="dialog-actions">
        <button id="editor-download" class="side-btn" type="button">Download</button>
        <span class="spacer"></span>
        <button id="editor-close" class="side-btn" type="button">Close</button>
        <button id="editor-save" class="side-btn primary" type="button">Save</button>
      </div>
    </dialog>

    <div id="menu" hidden></div>
    <div id="toast" hidden></div>

    <script type="module" src="/terminal/app.js"></script>
  </body>
</html>
