<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1c1d20" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>New chat</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-view="chat">
    <aside id="sidebar" aria-label="Chats">
      <div class="side-head">
        <div class="brand-row">
          <button id="close-sidebar" class="icon-btn panel-btn" type="button" aria-label="Hide sidebar" title="Hide sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
          </button>
          <span id="conn" class="conn" role="status" aria-live="polite"><span class="sr-only"></span></span>
        </div>
        <button id="new-chat" class="side-btn primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span>New chat</span>
          <kbd class="hint" id="new-chat-hint"></kbd>
        </button>
      </div>
      <nav id="chat-list"></nav>
      <div class="side-foot">
        <button id="open-shortcuts" class="side-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2" /><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10" /></svg>
          <span>Shortcuts</span>
          <kbd class="hint" id="shortcuts-hint"></kbd>
        </button>
        <a class="side-btn" href="/terminal/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="m7 9 3 3-3 3M13 15h4" /></svg>
          <span>Terminal</span>
          <span class="hint">↗</span>
        </a>
      </div>
    </aside>
    <div id="scrim"></div>

    <main id="main">
      <button id="open-sidebar" class="icon-btn panel-btn" type="button" aria-label="Show sidebar" title="Show sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
      </button>

      <section id="messages">
        <div id="welcome">
          <p>How can I help?</p>
        </div>
        <div id="thread"></div>
        <div id="loader-slot"></div>
      </section>
      <button id="jump" type="button" hidden aria-label="Scroll to bottom">↓</button>

      <section id="shortcuts-view" aria-labelledby="shortcuts-title">
        <div class="shortcuts-inner">
          <h1 id="shortcuts-title">Shortcuts</h1>
          <p class="shortcuts-hint">
            Press a shortcut to check that it works in this window — it gets a ✓.
            On this screen shortcuts are only checked, not run.
          </p>
          <ul id="shortcut-list"></ul>
          <button id="back-to-chat" class="side-btn" type="button">← Back to chat</button>
        </div>
      </section>

      <footer id="composer-wrap">
        <div id="queue"></div>
        <div id="attachments"></div>
        <div id="chat-stats"></div>
        <form id="composer">
          <button id="attach" class="icon-btn" type="button" aria-label="Attach">＋</button>
          <textarea id="input" rows="1" placeholder="Message…" autocomplete="off"></textarea>
          <button id="send" type="submit" aria-label="Send">↑</button>
        </form>
        <input type="file" id="file-input" multiple hidden />
      </footer>
    </main>

    <div id="usage-panel" hidden role="dialog" aria-label="Usage"></div>
    <div id="lightbox" hidden>
      <img alt="" />
      <div class="lightbox-bar">
        <a id="lightbox-open" target="_blank" rel="noopener">open original</a>
        <button type="button" id="lightbox-close" aria-label="Close">×</button>
      </div>
    </div>
    <div id="menu" hidden></div>
    <div id="toast" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
