# Config for megabrain's own tmux server (socket: `tmux -L megabrain`).
# It never touches your personal tmux. The web UI draws its own tab bar,
# so the status line is off to save a row on the phone.

set -g status off
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on

# Phone and laptop can be attached to the same tab: size it to whichever
# client typed last instead of the smallest one.
set -g window-size latest
set -g aggressive-resize on

# Programs can set the tab title (OSC 0/2); the UI shows it.
set -g allow-set-title on

# When the shell exits the tab is gone (the UI drops it).
set -g remain-on-exit off
